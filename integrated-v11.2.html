<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://docs.getgrist.com https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    connect-src 'self' https://www.ebi.ac.uk https://europepmc.org https://www.europepmc.org https://grist.numerique.gouv.fr https://docs.getgrist.com;
    font-src 'self' data:;
    object-src 'none';
    base-uri 'none';
    form-action 'self';
    frame-src 'none';
    media-src 'none';
    upgrade-insecure-requests
  " />
  <title>BioDynaMit — BDD Production v11.2</title>
  <meta name="description" content="BioDynaMit v11.2 Security & Production : interface durcie, administration désactivée et politique d'écriture limitée." />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="storage-integrated-v11.css?v=11.1.2" />
  <link rel="stylesheet" href="antibodies-layout-v11.1.3.css?v=11.1.3" />

  <!-- API officielle Grist -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <!-- Version figée de Three.js. À self-héberger ultérieurement pour réduire encore la dépendance CDN. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">Y</div>
        <div><div class="brand-title">BioDynaMit</div><div class="brand-sub">Antibody & Reagents</div></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-bottom">
        <!-- Pas de bouton Administration dans la build production -->
        <div class="profile"><div class="avatar">BD</div><div><strong>Laboratoire</strong><small>Utilisateur Grist</small></div></div>
      </div>
    </aside>
    <main class="main">
      <div id="topbar" class="topbar"></div>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal" class="modal-backdrop hidden"><div class="modal-card" id="modalCard"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
  <script src="storage-integrated-v11.js?v=11"></script>
  <script src="app-v11.1.2-patch.js?v=11.1.2"></script>
  <script src="documents-enrichment-v11.1.4.js?v=11.1.4"></script>
  <script src="antibody-experience-v11.1.5.js?v=11.1.5"></script>

  <!-- Toujours en dernier : couche de durcissement production -->
  <script src="security-production-v11.2.js?v=11.2"></script>
</body>
</html>
