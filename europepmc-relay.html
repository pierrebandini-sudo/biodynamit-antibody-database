<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BioDynaMit — Connexion Europe PMC</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f6f8fb;color:#14213d}
    main{max-width:520px;margin:36px auto;padding:22px}
    .card{background:white;border:1px solid #dce3ec;border-radius:14px;padding:20px;box-shadow:0 6px 24px rgba(20,33,61,.08)}
    .ok{color:#137333;font-weight:700}.muted{color:#667085;font-size:14px}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h2>BioDynaMit — Europe PMC</h2>
    <p id="status" class="ok">Connexion prête.</p>
    <p class="muted">Cette petite fenêtre sert uniquement de relais réseau pour la veille scientifique. Elle utilise le même site GitHub Pages que BioDynaMit et n'accède pas à tes données Grist.</p>
    <p class="muted">Laisse-la ouverte pendant la recherche. Tu peux la fermer ensuite.</p>
  </div>
</main>
<script>
(function(){
  'use strict';
  const parentOrigin=location.origin;
  const EPMC_RE=/^https:\/\/www\.ebi\.ac\.uk\/europepmc\/webservices\/rest\/search(?:\?|$)/i;

  function notifyReady(){
    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage({
          source:'BioDynaMitEuropePMCRelay',
          type:'ready'
        },parentOrigin);
      }
    }catch(_){}
  }

  window.addEventListener('message',async event=>{
    if(event.origin!==parentOrigin) return;
    const msg=event.data||{};
    if(msg.source!=='BioDynaMitWidget' || msg.type!=='fetch' || !msg.id) return;

    let responseMsg={
      source:'BioDynaMitEuropePMCRelay',
      type:'response',
      id:msg.id
    };

    try{
      const url=String(msg.url||'');
      if(!EPMC_RE.test(url)) throw new Error('URL Europe PMC non autorisée par le relais.');

      const r=await fetch(url,{
        method:'GET',
        mode:'cors',
        credentials:'omit',
        cache:'no-store'
      });
      const body=await r.text();

      responseMsg.status=r.status;
      responseMsg.contentType=r.headers.get('content-type')||'application/json';
      responseMsg.body=body;
      if(!r.ok) responseMsg.error=`Europe PMC HTTP ${r.status}`;
    }catch(err){
      responseMsg.error=err?.message||String(err);
    }

    try{ window.opener?.postMessage(responseMsg,parentOrigin); }catch(_){}
  });

  notifyReady();
  setInterval(notifyReady,1500);
})();
</script>
</body>
</html>
